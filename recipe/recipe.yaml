schema_version: 1

context:
  version: "6.2.0"

package:
  name: oslotest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslotest/oslotest-${{ version }}.tar.gz
  sha256: 1bd4e2dfc6dfc6612346436b4e3fa3d859319dcbcce069f5d00c38cc31d101cf
  patches:
    # do not install the oslo_debug_helper shell script, it's not portable
    # and we do not really need it
    - patches/remove-script.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pbr >=6.1.1
    - pip
  run:
    - python >=${{ python_min }}
    - fixtures >=3.0.0
    - testtools >=2.2.0

tests:
  - python:
      imports:
        - oslotest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - if: not win
    then:
      - script:
          - python -m unittest discover -v oslotest

about:
  summary: Oslo test framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://docs.openstack.org/oslotest

extra:
  recipe-maintainers:
    - mgorny
